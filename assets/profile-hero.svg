<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Naveen Singh — full-stack, n8n, AI agents and consulting</title>
  <desc id="desc">A light profile banner. The name sits in the centre, with four practice-area pills along a flowing path underneath.</desc>
  <defs>
    <filter id="heroShadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.10"/>
    </filter>
    <filter id="heroGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="heroLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#E07A5F"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="1180" height="280" rx="28" fill="#FFFFFF" stroke="#E6E9F2" stroke-width="1.5" filter="url(#heroShadow)"/>

  <text x="600" y="52" text-anchor="middle" fill="#4F46E5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.6">FULL-STACK DEVELOPER  ·  N8N  ·  AI AGENTS  ·  CONSULTING</text>

  <text x="600" y="112" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="700">Naveen Singh</text>
  <rect x="568" y="126" width="64" height="4" rx="2" fill="#4F46E5"/>

  <text x="600" y="164" text-anchor="middle" fill="#475569" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17">Independent contractor at UNICC, a United Nations agency</text>

  <g transform="translate(600 196)">
    <rect x="-168" y="-16" width="336" height="32" rx="16" fill="#EEF2FF" stroke="#C7D2FE"/>
    <circle cx="-148" cy="0" r="4.5" fill="#4F46E5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" fill="#3730A3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">linkedin.com/in/naveenslog</text>
  </g>

  <path d="M120 250 H1080" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 250 H1080" fill="none" stroke="url(#heroLine)" stroke-width="2" stroke-dasharray="5 11" stroke-linecap="round" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-96" dur="5.5s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(200 250)">
      <rect x="-72" y="-18" width="144" height="36" rx="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
      <text y="5" fill="#3730A3">FULL-STACK</text>
    </g>
    <g transform="translate(467 250)">
      <rect x="-52" y="-18" width="104" height="36" rx="18" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
      <text y="5" fill="#115E59">N8N</text>
    </g>
    <g transform="translate(733 250)">
      <rect x="-66" y="-18" width="132" height="36" rx="18" fill="#FFF1EC" stroke="#E07A5F" stroke-width="1.5"/>
      <text y="5" fill="#9A3412">AI AGENTS</text>
    </g>
    <g transform="translate(1000 250)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
      <text y="5" fill="#334155">CONSULTING</text>
    </g>
  </g>

  <g filter="url(#heroGlow)">
    <circle r="4.5" fill="#4F46E5">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M120,250 H1080"/>
    </circle>
    <circle r="4" fill="#0F766E">
      <animateMotion dur="6.5s" begin="-3.25s" repeatCount="indefinite" path="M120,250 H1080"/>
    </circle>
    <circle r="3.5" fill="#E07A5F">
      <animateMotion dur="6.5s" begin="-1.6s" repeatCount="indefinite" path="M120,250 H1080"/>
    </circle>
  </g>
</svg>
