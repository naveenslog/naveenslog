<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="96" viewBox="0 0 1100 96" role="img" aria-labelledby="title desc">
  <title id="title">Repositories continue below</title>
  <desc id="desc">A slim light footer pointing down toward the repositories on the GitHub profile.</desc>
  <defs>
    <filter id="ftShadow" x="-3%" y="-12%" width="106%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="ftLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#E07A5F"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="1088" height="84" rx="18" fill="#FFFFFF" stroke="#E6E9F2" stroke-width="1.5" filter="url(#ftShadow)"/>

  <text x="550" y="38" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700">Repositories are just below</text>

  <path d="M80 58 H500" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M600 58 H1020" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M80 58 H500" fill="none" stroke="url(#ftLine)" stroke-width="1.6" stroke-dasharray="4 9">
    <animate attributeName="stroke-dashoffset" values="0;-78" dur="4.8s" repeatCount="indefinite"/>
  </path>
  <path d="M1020 58 H600" fill="none" stroke="url(#ftLine)" stroke-width="1.6" stroke-dasharray="4 9">
    <animate attributeName="stroke-dashoffset" values="0;-78" dur="4.8s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(550 64)" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 -6 L0 4 L10 -6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
