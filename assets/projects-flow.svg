<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="160" viewBox="0 0 1100 160" role="img" aria-labelledby="title desc">
  <title id="title">How a piece of work moves</title>
  <desc id="desc">A light timeline with four stations — listen, automate, build and ship — and dots flowing along the path.</desc>
  <defs>
    <filter id="flowShadow" x="-3%" y="-10%" width="106%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.09"/>
    </filter>
    <filter id="flowGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="flowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#E07A5F"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="1088" height="148" rx="20" fill="#FFFFFF" stroke="#E6E9F2" stroke-width="1.5" filter="url(#flowShadow)"/>

  <text x="40" y="42" fill="#0F172A" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700">How a piece of work moves</text>
  <text x="40" y="64" fill="#64748B" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12">Listen, then automate, build and ship.</text>

  <path d="M40 108 H1060" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 108 H1060" fill="none" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="5 10" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-90" dur="5s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(200 108)">
      <circle r="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text y="36" fill="#3730A3">LISTEN</text>
    </g>
    <g transform="translate(467 108)">
      <circle r="16" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
      <text y="36" fill="#115E59">AUTOMATE</text>
    </g>
    <g transform="translate(733 108)">
      <circle r="16" fill="#FFF1EC" stroke="#E07A5F" stroke-width="2"/>
      <text y="36" fill="#9A3412">BUILD</text>
    </g>
    <g transform="translate(1000 108)">
      <circle r="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
      <text y="36" fill="#334155">SHIP</text>
    </g>
  </g>

  <g filter="url(#flowGlow)">
    <circle r="4.5" fill="#4F46E5">
      <animateMotion dur="5.8s" repeatCount="indefinite" path="M40,108 H1060"/>
    </circle>
    <circle r="3.5" fill="#E07A5F">
      <animateMotion dur="5.8s" begin="-2.9s" repeatCount="indefinite" path="M40,108 H1060"/>
    </circle>
  </g>
</svg>
