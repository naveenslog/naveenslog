<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="200" viewBox="0 0 1100 200" role="img" aria-labelledby="title desc">
  <title id="title">Four connected practice areas</title>
  <desc id="desc">A light diagram of four pillars — full-stack, n8n, AI agents and consulting — with dots flowing between them.</desc>
  <defs>
    <filter id="skShadow" x="-3%" y="-8%" width="106%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.09"/>
    </filter>
    <filter id="skGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#E07A5F"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="1088" height="188" rx="20" fill="#FFFFFF" stroke="#E6E9F2" stroke-width="1.5" filter="url(#skShadow)"/>

  <path d="M145 100 C 310 36, 430 36, 550 100 C 670 164, 790 164, 955 100" fill="none" stroke="#E2E8F0" stroke-width="3"/>
  <path d="M145 100 C 310 36, 430 36, 550 100 C 670 164, 790 164, 955 100" fill="none" stroke="url(#skLine)" stroke-width="2" stroke-dasharray="5 11" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-96" dur="6s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(145 100)">
      <rect x="-82" y="-30" width="164" height="60" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
      <text y="0" fill="#3730A3" font-size="13" font-weight="700">FULL-STACK</text>
      <text y="18" fill="#64748B" font-size="10">Python · FastAPI · React</text>
    </g>
    <g transform="translate(415 70)">
      <rect x="-74" y="-30" width="148" height="60" rx="16" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
      <text y="0" fill="#115E59" font-size="13" font-weight="700">N8N</text>
      <text y="18" fill="#64748B" font-size="10">Workflow automation</text>
    </g>
    <g transform="translate(685 130)">
      <rect x="-78" y="-30" width="156" height="60" rx="16" fill="#FFF1EC" stroke="#E07A5F" stroke-width="1.5"/>
      <text y="0" fill="#9A3412" font-size="13" font-weight="700">AI AGENTS</text>
      <text y="18" fill="#64748B" font-size="10">Tools · guardrails</text>
    </g>
    <g transform="translate(955 100)">
      <rect x="-78" y="-30" width="156" height="60" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
      <text y="0" fill="#334155" font-size="13" font-weight="700">CONSULTING</text>
      <text y="18" fill="#64748B" font-size="10">Open source · automation</text>
    </g>
  </g>

  <g filter="url(#skGlow)">
    <circle r="4.5" fill="#4F46E5">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M145,100 C 310,36 430,36 550,100 C 670,164 790,164 955,100"/>
    </circle>
    <circle r="3.5" fill="#E07A5F">
      <animateMotion dur="6.5s" begin="-3.25s" repeatCount="indefinite" path="M145,100 C 310,36 430,36 550,100 C 670,164 790,164 955,100"/>
    </circle>
  </g>
</svg>
